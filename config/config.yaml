# will store training hyper params and 
env:
  name: ALE/Breakout-v5
  frame_skip: 1

agent:
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_frame: 250000  # in agent-steps; ~1M game frames at skip=4 (matches DeepMind Nature paper)
  learning_rate: 0.0001 # 1e-4, appropriate for Adam optimizer
  target_update_freq: 10000
  memory_capacity: 1000000
  batch_size: 32
  replay_start_size: 50000  # number of transitions to collect before any gradient updates
  num_actions: 4

training:
  num_episodes: 20000
  update_freq: 4
  # Keep a numbered snapshot (checkpoints/ep_{N}.pth) every this many completed
  # episodes, in addition to latest.pth, so a run that degrades late can be
  # rolled back to an earlier policy. Snapshots land on the first regular
  # (per-100-episode) checkpoint at/after each multiple. Set <=0 to disable.
  save_model_freq: 1000
  # Pickling the ~7GB replay buffer on every checkpoint is slow and disk-heavy.
  # Leave off for long unattended runs; resume just re-warms the buffer.
  save_replay_buffer: false

logging:
  wandb_enabled: true        # live metrics to Weights & Biases (web + phone app)
  wandb_project: dqn-breakout

